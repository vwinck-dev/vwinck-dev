name: Generate Stats Images

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One group per workflow, not one shared group: GitHub keeps a single
# pending run per concurrency group, so sharing one with terminal.yml did not
# queue the two workflows -- it cancelled whichever lost the race, on every
# push. They still both write to actions_branch; the publish step rebases.
concurrency:
  group: ${{ github.workflow }}-actions_branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5

      - name: Fetch the stats generator
        run: |
          git clone --depth 1 https://github.com/rahul-jha98/github-stats-transparent.git generator

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python3 -m pip install -r generator/requirements.txt

      # The generator writes a single card. GitHub can serve a different image
      # per theme via #gh-dark-mode-only / #gh-light-mode-only, so we run it
      # twice, dressing a fresh copy of its templates in the brand palette for
      # each theme. restyle_stats.py is stdlib-only, like the other generators.
      - name: Generate images
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          COUNT_STATS_FROM_FORKS: ${{ secrets.COUNT_STATS_FROM_FORKS }}
        run: |
          set -euo pipefail
          cd generator
          cp -r templates templates.orig
          mkdir -p ../out

          # Restyling edits the templates in place, so each theme starts over
          # from the pristine copy.
          fresh() { rm -rf templates && cp -r templates.orig templates; }
          cards="templates/overview.svg templates/languages.svg"

          fresh
          python3 ../scripts/restyle_stats.py --theme dark $cards
          python3 generate_images.py
          cp generated/overview.svg  ../out/overviewDarkMode.svg
          cp generated/languages.svg ../out/languagesDarkMode.svg

          fresh
          python3 ../scripts/restyle_stats.py --theme light $cards
          python3 generate_images.py
          cp generated/overview.svg  ../out/overviewLightMode.svg
          cp generated/languages.svg ../out/languagesLightMode.svg

      - name: Publish to actions_branch
        run: |
          set -euo pipefail
          git config user.name  "github-stats[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin actions_branch || true
          if git rev-parse --verify origin/actions_branch >/dev/null 2>&1; then
            git checkout -B actions_branch origin/actions_branch
          else
            git checkout --orphan actions_branch
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -maxdepth 1 -mindepth 1 ! -name .git ! -name out -exec rm -rf {} +
          fi
          cp out/*.svg .
          # Drop the build directory before staging: a bare '*.svg' pathspec
          # is repo-wide and would publish out/ alongside the real files.
          rm -rf out
          git rm -r --cached --ignore-unmatch --quiet out
          git add -- ./*.svg
          git commit -m "Update generated stats images" || echo "no changes"
          # Both workflows run in parallel and write to the same branch, so
          # losing the race is routine: rebase onto whatever landed first and
          # try again, rather than forcing over the other one's files.
          for attempt in 1 2 3 4 5; do
            git push origin actions_branch && exit 0
            echo "push rejected on attempt ${attempt}, rebasing"
            git pull --rebase origin actions_branch
            sleep $(( attempt * 5 ))
          done
          exit 1
